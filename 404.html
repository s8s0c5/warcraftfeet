<!DOCTYPE html>
<html>
<head>
    <title>Warcraft Feet</title>
    <base href="/">
    <script>
        if (sessionStorage.redirect) {
            history.replaceState(null, '', sessionStorage.redirect);
            delete sessionStorage.redirect;
        }
    </script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        #search {
            font-size: 18px;
            padding: 10px;
            width: 300px;
            margin: 20px 0;
        }
        .person {
            display: block;
            margin: 20px auto;
            text-align: center;
        }
        .frame {
            display: inline-flex;
            align-items: center;
        }
        .person img {
            max-width: 900px;
            border: 2px solid #333;
        }
        .next {
            width: 48px;
            height: 48px;
            margin-left: 16px;
            padding: 0;
            border: none;
            border-radius: 50%;
            background: #222;
            color: #fff;
            font-size: 28px;
            line-height: 48px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .person h3 {
            margin: 10px 0;
        }
        #showall {
            font-size: 18px;
            padding: 10px 16px;
            margin-left: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <input type="text" id="search" placeholder="Search character name...">
    <button type="button" id="showall">show all</button>
    
    <div class="gallery" id="gallery"></div>

    <script>
        const characters = [
            // Newest on top
            { name: "roshiki", images: ["images/roshiki1.JPG", "images/roshiki2.JPG"] },
            { name: "paladan", images: ["images/paladan.JPG", "images/paladan2.JPG"] },
            { name: "bigstink", images: ["images/bigstink1.JPG", "images/bigstink2.JPG"] },
            { name: "pinnen", images: ["images/pinnen.JPG", "images/pinnen1.JPG"] },
            { name: "frothiee", image: "images/frothiee.JPG" },
            { name: "camioneta", image: "images/camioneta.JPG" },
            { name: "donpelippe", image: "images/donpelippe.JPG" },
            { name: "pallando", image: "images/pallando.JPG" },
            { name: "zoe", image: "images/zoe.JPG" },
            { name: "vaelia", image: "images/vaelia.JPG" },
            { name: "aecheur", image: "images/aecheur.JPG" },
            { name: "tex", image: "images/tex.jpg" },
            { name: "sckmysnake", image: "images/sckmysnake.jpg" },
            { name: "hurtem", image: "images/hurtem.jpg" },
            { name: "hamurgrr", image: "images/hamurgrr.jpg" },
            { name: "ketchpup", image: "images/ketchpup.jpg" },
            { name: "sulamara", image: "images/sulamara.jpg" },
            { name: "missminty", image: "images/missminty.jpg" },
            { name: "zybil", image: "images/zybil.jpg" },
            { name: "dorage", image: "images/dorage.jpg" },
            { name: "outrageous", image: "images/outrageous.jpg" },
            { name: "snork", image: "images/snork.jpg" },
            { name: "genzy", image: "images/genzy.jpg" },
            { name: "gadralla", image: "images/gadralla.jpg" },
            { name: "poiszon", image: "images/poiszon.jpg" },
            { name: "casslyna", image: "images/casslyna.jpg" },
            { name: "shaylah", image: "images/shaylah.jpg" },
            { name: "santanight", image: "images/santanight.jpg" },
            { name: "onigirii", image: "images/Onigirii.jpg" },
            { name: "tuskgorr", image: "images/tuskgorr.jpg" },


        ];

        function getSlugFromPath() {
            const parts = location.pathname.replace(/\/$/, '').split('/').filter(Boolean);
            if (parts.length === 0) return '';
            if (parts[0] === 'warcraftfeet') return parts[1] || '';
            return parts[0];
        }

        function displayCharacters(filter = '', exact = false) {
            const gallery = document.getElementById('gallery');
            const f = filter.toLowerCase();
            const filtered = characters.filter(char => {
                const name = char.name.toLowerCase();
                return exact ? name === f : name.includes(f);
            });
            
            if (filtered.length === 0) {
                gallery.innerHTML = "<p>you're safe, for now</p>";
            } else {
                gallery.innerHTML = filtered.map(char => {
                    const pics = char.images || [char.image];
                    return `
                    <div class="person" data-pics="${pics.join('|')}" data-i="0">
                        <div class="frame">
                            <img src="${pics[0]}" alt="${char.name}">
                            ${pics.length > 1 ? '<button type="button" class="next">›</button>' : ''}
                        </div>
                        <h3>${char.name}</h3>
                    </div>
                `;
                }).join('');
            }
        }

        document.getElementById('gallery').addEventListener('click', (e) => {
            if (!e.target.classList.contains('next')) return;
            const person = e.target.closest('.person');
            const pics = person.getAttribute('data-pics').split('|');
            let i = Number(person.getAttribute('data-i')) + 1;
            if (i >= pics.length) i = 0;
            person.setAttribute('data-i', i);
            person.querySelector('img').src = pics[i];
        });

        document.getElementById('search').addEventListener('input', (e) => {
            displayCharacters(e.target.value);
        });

        document.getElementById('showall').addEventListener('click', () => {
            document.getElementById('search').value = '';
            history.replaceState(null, '', '/');
            displayCharacters();
        });

        const urlSlug = getSlugFromPath();
        if (urlSlug) {
            document.getElementById('search').value = urlSlug;
            displayCharacters(urlSlug, true);
        } else {
            displayCharacters();
        }
    </script>
</body>
</html>
