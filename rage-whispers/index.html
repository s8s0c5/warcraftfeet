<!DOCTYPE html>
<html>
<head>
    <title>Horde Rage Whispers</title>
    <base href="/">
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        #search {
            font-size: 18px;
            padding: 10px;
            width: 300px;
            margin: 20px 0;
        }
        .person {
            display: block;
            max-width: 960px;
            margin: 40px auto;
            padding: 20px;
            border: 2px solid #333;
            text-align: center;
        }
        .person .whisper img {
            max-width: 900px;
            width: 100%;
        }
        .person .gank img {
            max-width: 380px;
            margin-bottom: 12px;
        }
        .person h3 {
            margin: 16px 0 4px;
        }
        .person .killed {
            margin: 0;
            color: #666;
            font-size: 14px;
        }
        #showall {
            font-size: 18px;
            padding: 10px 16px;
            margin-left: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <p><a href="/index.html">home</a></p>
    <h1>Horde Rage Whispers</h1>

    <input type="text" id="search" placeholder="Search character name...">
    <button type="button" id="showall">show all</button>

    <div class="gallery" id="gallery"></div>

    <script>
        const whispers = [
            // Newest on top
            {
                name: "superbull",
                names: ["superbull", "zagan"],
                killedBy: ["xfraz", "pee"],
                items: [
                    { gank: "rage_whispers_images/superbull/1-a.JPG", whisper: "rage_whispers_images/superbull/1-b.png" }
                ]
            },
        ];

        function getSlug() {
            if (location.hash) return decodeURIComponent(location.hash.slice(1));
            const parts = location.pathname.replace(/\/$/, '').split('/').filter(Boolean);
            if (parts[0] === 'warcraftfeet') parts.shift();
            if (parts[0] !== 'rage-whispers') return '';
            return parts[1] || '';
        }

        function displayWhispers(filter = '', exact = false) {
            const gallery = document.getElementById('gallery');
            const f = filter.toLowerCase();
            const filtered = whispers.filter(entry => {
                const all = entry.names.concat(entry.killedBy);
                return all.some(n => {
                    const name = n.toLowerCase();
                    return exact ? name === f : name.includes(f);
                });
            });

            if (filtered.length === 0) {
                gallery.innerHTML = "<p>you're safe, for now</p>";
            } else {
                gallery.innerHTML = filtered.map(entry => {
                    return entry.items.map(item => `
                    <div class="person">
                        <div class="gank"><img src="${item.gank}" alt="${entry.names.join(', ')} gank"></div>
                        <div class="whisper"><img src="${item.whisper}" alt="${entry.names.join(', ')}"></div>
                        <h3>${entry.names.join(', ')}</h3>
                        <p class="killed">Killed by: ${entry.killedBy.join(', ')}</p>
                    </div>
                    `).join('');
                }).join('');
            }
        }

        document.getElementById('search').addEventListener('input', (e) => {
            displayWhispers(e.target.value);
        });

        document.getElementById('showall').addEventListener('click', () => {
            document.getElementById('search').value = '';
            history.replaceState(null, '', '/rage-whispers/');
            displayWhispers();
        });

        const urlSlug = getSlug();
        if (urlSlug) {
            document.getElementById('search').value = urlSlug;
            displayWhispers(urlSlug, true);
        } else {
            displayWhispers();
        }
    </script>
</body>
</html>
